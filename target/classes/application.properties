server.port=9090

spring.application.name=api-gateway

# Project Service Route
spring.cloud.gateway.routes[0].id=project-service
spring.cloud.gateway.routes[0].uri=http://localhost:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/projects/**

# Notification Service Route
spring.cloud.gateway.routes[1].id=notification-service
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/notifications/**

# Kanban Service Route
spring.cloud.gateway.routes[2].id=kanban-service
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/kanban/**

management.endpoints.web.exposure.include=health,gateway
