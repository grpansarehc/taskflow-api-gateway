server.port=8080
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
app.jwtSecret=404E635266556A586E3978357538782G413F4428472B4B6250645367566B5970

# ======================================================
# GLOBAL CORS CONFIGURATION
# ======================================================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# ======================================================
# ROUTES
# ======================================================

# ----------------- UMS ROUTE (The Login Route) -----------------
spring.cloud.gateway.routes[0].id=ums-route
spring.cloud.gateway.routes[0].uri=lb://UMS-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /api/users/**

# FIX: Add this line to remove duplicate CORS headers from UMS
spring.cloud.gateway.routes[0].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ----------------- PMS ROUTE -----------------
spring.cloud.gateway.routes[1].id=pms-route
spring.cloud.gateway.routes[1].uri=lb://PROJECT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/projects/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# Dedupe filter for PMS
spring.cloud.gateway.routes[1].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ----------------- KANBAN SERVICE ROUTE -----------------
spring.cloud.gateway.routes[2].id=kanban-route
spring.cloud.gateway.routes[2].uri=lb://KANBAN-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/kanban/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# Dedupe filter for Kanban
spring.cloud.gateway.routes[2].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ----------------- TASK SERVICE ROUTE -----------------
spring.cloud.gateway.routes[3].id=task-route
spring.cloud.gateway.routes[3].uri=lb://TMS-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/tasks/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

# Dedupe filter for Task Service
spring.cloud.gateway.routes[3].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ----------------- NOTIFICATION SERVICE ROUTE -----------------
spring.cloud.gateway.routes[4].id=notification-route
spring.cloud.gateway.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

# Dedupe filter for Notification Service
spring.cloud.gateway.routes[4].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

management.endpoints.web.exposure.include=health,gateway

# ======================================================
# SWAGGER CONFIGURATION
# ======================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=true

# Grouping / Aggregation
springdoc.swagger-ui.urls[0].name=User Management Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/ums

springdoc.swagger-ui.urls[1].name=Project Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/projects

# ======================================================
# DOCS ROUTES (Proxy /v3/api-docs/{service} to actual service)
# ======================================================

# Documentation Route for UMS
spring.cloud.gateway.routes[5].id=ums-docs-route
spring.cloud.gateway.routes[5].uri=lb://UMS-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/v3/api-docs/ums
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/v3/api-docs/ums, /v3/api-docs

# Documentation Route for Project Service
spring.cloud.gateway.routes[6].id=pms-docs-route
spring.cloud.gateway.routes[6].uri=lb://PROJECT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/v3/api-docs/projects
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/v3/api-docs/projects, /v3/api-docs

# ======================================================
# KEYCLOAK OAUTH2 RESOURCE SERVER CONFIGURATION
# ======================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_SERVER_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:taskflow}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_SERVER_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:taskflow}/protocol/openid-connect/certs